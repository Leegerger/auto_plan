[project]
name = "auto-plan"
version = "0.1.0"
description = "Bonding production scheduling"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "oracledb>=3,<5", "pydantic-settings>=2,<3", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["oracle: controlled PLAN_TEST public API tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/auto_plan"]
