<!-- Throwaway: three scheduling UI variants (?variant=A/B/C). First feedback round: navigation, selection, batch quantity. No production solver or persistence. -->
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonding · 手动排程交互原型</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203346;background:#f3f5f7;font-size:14px}*{box-sizing:border-box}body{margin:0;padding-bottom:90px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ced8df;background:white;color:#294258;border-radius:6px;padding:8px 11px}button:hover{background:#ecf4f7}button:disabled{opacity:.45;cursor:not-allowed}input,select{border:1px solid #bdcbd5;border-radius:5px;padding:7px;background:white;max-width:100%}header{padding:20px 26px;background:#183446;color:white;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0 0 5px}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:12px 0}p{line-height:1.65;margin:7px 0}.muted{color:#62788b;font-size:12px}.notice{background:#fff4d9;border-bottom:1px solid #ecd8a8;padding:11px 26px;color:#6b5422}.controls{padding:16px 24px;background:white;border-bottom:1px solid #dce4ea}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.weeks{display:flex;gap:5px;overflow:auto;margin-bottom:13px}.weeks button{min-width:66px}.active,.primary{background:#167078!important;color:white!important;border-color:#167078!important}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:18px 24px}.card{background:white;border:1px solid #dce4ea;border-radius:9px;padding:17px;min-width:0}.scroll{overflow:auto;max-height:590px}table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}th,td{border-right:1px solid #e2e9ee;border-bottom:1px solid #e2e9ee;vertical-align:top;padding:8px}th{background:#edf2f5;position:sticky;top:0;z-index:2;white-space:nowrap}th:first-child{left:0;z-index:3}td:first-child{position:sticky;left:0;background:white;z-index:1;min-width:62px}.cell{min-width:130px;cursor:pointer;background:#fff}.selected{box-shadow:inset 0 0 0 2px #188087;background:#ebf8f7!important}.holiday{background:#f5f2ee}.chip{display:flex;justify-content:space-between;gap:12px;padding:4px 5px;border-radius:3px;margin:3px 0;background:#edf3f9}.r2{background:#f0edfa}.locked{border-left:3px solid #b98b37}.badge{display:inline-block;border-radius:4px;padding:3px 6px;font-size:11px;background:#e7f3f1;color:#216860}.warning{background:#fff0d1;color:#78551b}.danger{background:#fce9e7;color:#a1322c}.stat{padding:9px 13px;background:#f4f7f9;border-radius:6px;flex:1;min-width:120px}.stat strong{display:block;font-size:19px;margin-top:4px}.days{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:9px;overflow:auto}.day{padding:12px;background:#f7f9fb;border:1px solid #dce4ea;border-radius:7px;cursor:pointer}.segment{margin:9px 0;padding:12px 8px;border-left:4px solid #5787ac;background:#eaf1f7}.segment.r2{border-color:#9981bc;background:#f1edf8}.line-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin-bottom:12px}.wide{grid-column:1/-1}.steps{display:flex;gap:16px;margin-bottom:18px;color:#637788}.step{border-bottom:3px solid #bdd0d8;padding:10px}.step.current{border-color:#147078;color:#147078}.wizard{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#183446;color:white;padding:8px;display:flex;align-items:center;gap:12px;border-radius:40px;box-shadow:0 6px 25px #18344640;z-index:20;white-space:nowrap}.switcher button{border:0;border-radius:24px;background:#345368;color:white}.switcher span{min-width:170px;text-align:center}.details{margin-top:15px;padding-top:12px;border-top:1px solid #dde6eb}#status{padding:0 24px;color:#1c6065;min-height:20px}dialog{width:min(950px,94vw);max-height:88vh;border:0;border-radius:12px;padding:24px;color:#203346;box-shadow:0 20px 80px #102d4950}dialog::backdrop{background:#17334370}.diff{max-height:300px;overflow:auto;margin:15px 0}.footer{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.proposal{padding:10px;background:#f0f5f9;border-radius:6px;margin:12px 0}pre{white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.focus{border-left:4px solid #16838b;padding-left:12px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.wizard{grid-template-columns:1fr}.days{grid-template-columns:repeat(7,180px)}header{display:block}.layout,.controls{padding:12px}}:focus-visible{outline:3px solid #deac44;outline-offset:2px}
</style></head><body>
<header><div><h1>Bonding / 每日计划工作台</h1><div style="color:#bdd2df">日期 × 线体 × 机种 × 投入数量 · 北京时间 08:00 分界</div></div><div>交互原型 01 · 待用户反馈</div></header>
<div class="notice">可抛弃原型 · 示例数据，刷新即重置。布局和操作默认值均为提案。本轮可试导航、选区、批量填量、预览及撤销；交换、顺延与采用仅展示下一轮讨论入口。</div>
<div class="controls"><div class="weeks" id="weeks"></div><div class="row"><label>线体 <select id="lineFilter"><option value="all">全部 18 条</option><option value="0">L01–L06</option><option value="6">L07–L12</option><option value="12">L13–L18</option></select></label><label>机种 <select id="modelFilter"><option value="all">全部示例机种</option><option>A</option><option>B</option><option>C</option></select></label><label>视窗 <select id="zoom"><option value="7">一周 · 每日</option><option value="21">三周 · 每日（横向滚动）</option></select></label><button id="resetSelection">清空选区</button><button id="undo">撤销上次草稿修改</button><button id="reset">重置示例</button></div></div>
<div id="status" role="status" aria-live="polite"></div><main id="main"></main>
<div class="switcher"><button id="prev" aria-label="上一个布局">←</button><span id="variantLabel"></span><button id="next" aria-label="下一个布局">→</button></div>
<dialog id="modal"><div id="modalBody"></div></dialog>
<script>
const names={A:'周表格 + 详情',B:'单线顺序工作台',C:'范围操作向导'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let week=0,focusLine=0,focusDay=2,selected=new Set(['0:2','0:3']),anchor=null,history=[],pending=null;
let batchModel='A',batchMode='daily',batchQty=600;
const models=['A','B','C'],recipe={A:'R1',B:'R2',C:'R1'},$=id=>document.getElementById(id);
const key=(l,d,m)=>`${l}:${d}:${m}`,cellKey=(l,d)=>`${l}:${d}`,clone=x=>JSON.parse(JSON.stringify(x));
const date=d=>{const t=new Date(Date.UTC(2026,9,5+d));return `${t.getUTCMonth()+1}/${t.getUTCDate()}`};
const line=l=>'L'+String(l+1).padStart(2,'0');const holiday=d=>d%7===5||d%7===6;
const locks=new Set([key(0,2,'A'),key(1,3,'B')]);
let baseline={},draft={};
function init(){baseline={};for(let l=0;l<18;l++)for(let d=0;d<105;d++)for(const m of models){baseline[key(l,d,m)]=holiday(d)?0:m==='A'?600+(l%3)*100:m==='B'?(d%3===0?300:0):200;}baseline[key(1,3,'B')]=0;draft=clone(baseline);history=[];}
function total(l,d){return models.reduce((s,m)=>s+draft[key(l,d,m)],0)}
function lines(){const f=$('lineFilter').value;return Array.from({length:f==='all'?18:6},(_,i)=>i+(f==='all'?0:+f))}
function days(){return Array.from({length:Math.min(+$('zoom').value,105-week*7)},(_,i)=>i+week*7)}
function shownModels(){return $('modelFilter').value==='all'?models:[$('modelFilter').value]}
function notify(t){$('status').textContent=t}
function select(l,d,e){focusLine=l;focusDay=d;const k=cellKey(l,d);if(e.shiftKey&&anchor){for(let a=Math.min(l,anchor[0]);a<=Math.max(l,anchor[0]);a++)for(let b=Math.min(d,anchor[1]);b<=Math.max(d,anchor[1]);b++)selected.add(cellKey(a,b));}else{selected.has(k)?selected.delete(k):selected.add(k);anchor=[l,d];}render()}
function renderWeeks(){$('weeks').innerHTML=Array.from({length:15},(_,w)=>`<button data-week="${w}" class="${w===week?'active':''}">W${w+1}<br><small>${date(w*7)}</small></button>`).join('');$('weeks').querySelectorAll('button').forEach(b=>b.onclick=()=>{week=+b.dataset.week;focusDay=week*7;selected.clear();anchor=null;render()})}
function cell(l,d){return `<td tabindex="0" role="button" aria-label="${line(l)} ${date(d)} 选择" data-l="${l}" data-d="${d}" class="cell ${holiday(d)?'holiday':''} ${selected.has(cellKey(l,d))?'selected':''}"><div class="muted">${holiday(d)?'Holiday · 0h':l===0&&d===3?'保养 4h · 可用 20h':'可用 24h'} · ${total(l,d)} 片</div>${shownModels().map(m=>`<div class="chip ${recipe[m]==='R2'?'r2':''} ${locks.has(key(l,d,m))?'locked':''}"><span>${m} <small>${recipe[m]}</small></span><b>${draft[key(l,d,m)]}${locks.has(key(l,d,m))?' 🔒':''}</b></div>`).join('')}</td>`}
function table(ls=lines(),ds=days()){return `<div class="scroll"><table><thead><tr><th>线体</th>${ds.map(d=>`<th>${date(d)} 周${'一二三四五六日'[d%7]}</th>`).join('')}</tr></thead><tbody>${ls.map(l=>`<tr><td><b>${line(l)}</b></td>${ds.map(d=>cell(l,d)).join('')}</tr>`).join('')}</tbody></table></div>`}
function metrics(){let diff=0,base=0;for(let d=week*7;d<week*7+7;d++)for(let l=0;l<18;l++)for(const m of models){const k=key(l,d,m);base+=baseline[k];diff+=Math.abs(draft[k]-baseline[k]);}return `<div class="row"><div class="stat">W${week+1} 数量变化率<strong>${(diff/base*100).toFixed(1)}%</strong><small>相对示例采用版 · 整周 18 线</small></div><div class="stat">绝对变化量<strong>${diff.toLocaleString()} 片</strong><small>顺序变化另列；本轮未模拟</small></div></div>`}
function batchForm(){return `<div class="field"><label for="batchModel">批量填量机种</label><select id="batchModel">${models.map(m=>`<option ${m===batchModel?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label for="batchMode">填写口径（两个备选）</label><select id="batchMode"><option value="daily" ${batchMode==='daily'?'selected':''}>每个所选单元覆盖为同一数量</option><option value="total" ${batchMode==='total'?'selected':''}>选区总量，按单元平均分配</option></select></div><div class="field"><label for="qty">投入数量 / 片</label><input id="qty" type="number" min="0" step="1" value="${batchQty}"></div><p class="muted">单元 = 日期 × 线体 × 所选机种。总量备选按日期、线体顺序均分，余数依次加 1；这是待讨论的分配方式。</p><button class="primary" id="preview">预览批量填量</button>`}
function detail(){const l=focusLine,d=focusDay;return `<div class="details"><h3>${line(l)} · ${date(d)} 日内顺序示意</h3>${models.filter(m=>draft[key(l,d,m)]>0).map((m,i)=>`<p>${i+1}. 机种 ${m} · ${recipe[m]} · ${draft[key(l,d,m)]} 片</p>`).join('')||'<p>暂无投入</p>'}<p class="muted">顺序是示例固定排列，不代表计算出的最优顺序。此处不画具体时刻，日历只维护日级工时。</p><div class="toolbar"><button data-topic="swap">交换机种</button><button data-topic="push">改量后顺延</button><button data-topic="lock">锁定 / 恢复</button></div></div>`}
function state(){return `<details class="details"><summary>查看当前原型状态</summary><pre>${JSON.stringify({layout:variant,week:week+1,lines:$('lineFilter').value,model:$('modelFilter').value,selected:[...selected].map(k=>{const[l,d]=k.split(':').map(Number);return {line:line(l),date:date(d),quantities:models.map(m=>({model:m,quantity:draft[key(l,d,m)],locked:locks.has(key(l,d,m))}))}}),undoSteps:history.length,solver:'未接入',formalAdoption:'未模拟'},null,2)}</pre></details>`}
function sidebar(){return `<aside class="card"><h2>操作与影响</h2><p class="focus">已选 <b>${selected.size}</b> 个日期 × 线体<br><small>随后指定一个机种</small></p>${batchForm()}${detail()}${state()}</aside>`}
function VariantA(){return `<div class="layout"><section class="card"><h2>A · 周表格：先找日期和线体，再编辑数量</h2><p class="muted">点击单元可多选，Shift + 点击扩成矩形。选区不会因筛选而消失；切换周别会清空。以上均待确认。</p>${metrics()}<div style="height:15px"></div>${table()}</section>${sidebar()}</div>`}
function VariantB(){return `<div class="layout" style="grid-template-columns:1fr"><section class="card"><h2>B · 单线工作台：先看连续生产，再编辑</h2><div class="line-nav">${lines().map(l=>`<button data-line="${l}" class="${l===focusLine?'active':''}">${line(l)}</button>`).join('')}</div><div class="days">${days().map(d=>`<div tabindex="0" role="button" data-l="${focusLine}" data-d="${d}" class="day ${selected.has(cellKey(focusLine,d))?'selected':''}"><b>${date(d)} · 周${'一二三四五六日'[d%7]}</b><p class="muted">${holiday(d)?'Holiday · 不可投入':'生产顺序示意'} · ${total(focusLine,d)} 片</p>${shownModels().filter(m=>draft[key(focusLine,d,m)]>0).map(m=>`<div class="segment ${recipe[m]==='R2'?'r2':''}"><b>${m} · ${draft[key(focusLine,d,m)]} 片</b><p>${recipe[m]} ${locks.has(key(focusLine,d,m))?'🔒 数量锁定':''}</p></div>`).join('')}</div>`).join('')}</div></section><div class="wizard"><section class="card"><h2>批量操作 · 已选 ${selected.size} 格</h2>${batchForm()}</section><section class="card">${metrics()}${detail()}${state()}</section></div></div>`}
function VariantC(){return `<div class="layout" style="grid-template-columns:1fr"><section class="card"><h2>C · 操作向导：先表达意图，再核对影响</h2><div class="steps"><span class="step current">1 选择范围</span><span class="step">2 填写数量</span><span class="step">3 预览后写入草稿</span></div><div class="wizard"><div><h3>明确范围</h3><div class="fields"><label class="field">开始日期<select id="from">${days().map(d=>`<option value="${d}">${date(d)}</option>`).join('')}</select></label><label class="field">结束日期<select id="to">${days().map(d=>`<option value="${d}" ${d===week*7+4?'selected':''}>${date(d)}</option>`).join('')}</select></label><label class="field wide">线体<select id="rangeLine"><option value="visible">当前筛选的全部线体</option>${lines().map(l=>`<option value="${l}">${line(l)}</option>`).join('')}</select></label></div><button id="range">设为选区</button><p>当前选中 ${selected.size} 个日期 × 线体</p><hr>${batchForm()}</div><div>${metrics()}<h3>范围内的每日安排（也可点选）</h3>${table()}${state()}</div></div></section></div>`}
function render(){renderWeeks();$('main').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])();$('variantLabel').textContent=`${variant} · ${names[variant]}`;$('undo').disabled=!history.length;document.querySelectorAll('[data-l]').forEach(el=>{el.onclick=e=>select(+el.dataset.l,+el.dataset.d,e);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(+el.dataset.l,+el.dataset.d,e)}}});document.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{focusLine=+b.dataset.line;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>topic(b.dataset.topic));$('preview').onclick=preview;$('batchModel').onchange=e=>batchModel=e.target.value;$('batchMode').onchange=e=>batchMode=e.target.value;$('qty').oninput=e=>batchQty=e.target.value;if($('range'))$('range').onclick=()=>{const a=+$('from').value,b=+$('to').value;if(a>b){notify('开始日期不能晚于结束日期');return}const ls=$('rangeLine').value==='visible'?lines():[+$('rangeLine').value];selected.clear();for(const l of ls)for(let d=a;d<=b;d++)selected.add(cellKey(l,d));render()};}
function preview(){const qty=Number($('qty').value);if(!selected.size||!Number.isSafeInteger(qty)||qty<0){notify('请选择至少一个单元，并填写非负整数投入数量。');return}batchQty=qty;const cells=[...selected].map(k=>k.split(':').map(Number)).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);pending=cells.map(([l,d],i)=>{const k=key(l,d,batchModel),after=batchMode==='daily'?qty:Math.floor(qty/cells.length)+(i<qty%cells.length?1:0);let issue=locks.has(k)&&draft[k]!==after?'数量锁定：需先显式解锁':holiday(d)&&after>0?'Holiday：零可用工时':'';return {k,l,d,m:batchModel,before:draft[k],after,issue}});const bad=pending.filter(x=>x.issue);const change=pending.reduce((s,x)=>s+Math.abs(x.after-x.before),0);$('modalBody').innerHTML=`<h2>批量填量预览 · ${pending.length} 个单元</h2><p>意图：${batchMode==='daily'?`每个单元覆盖为 ${qty} 片`:`选区合计 ${qty} 片，平均分配`}。现有数量将被替换，不是追加。</p><div class="proposal">这是交互预览：只检查示例锁定与 Holiday。完整产能、切机、良率、出货及跨周确认尚未计算，不能视作有效候选。</div><div class="row"><div class="stat">本次操作绝对差<strong>${change} 片</strong></div><div class="stat">已发现的示例冲突<strong>${bad.length} 处</strong></div></div><div class="diff"><table><thead><tr><th>日期 / 线体 / 机种</th><th>当前 → 填量后</th><th>检查结果</th></tr></thead><tbody>${pending.map(x=>`<tr><td>${date(x.d)} / ${line(x.l)} / ${x.m}</td><td>${x.before} → <b>${x.after}</b></td><td><span class="badge ${x.issue?'danger':'warning'}">${x.issue||'示例检查通过 · 完整校验未模拟'}</span></td></tr>`).join('')}</tbody></table></div><p>${bad.length?'提案：整次操作暂不写入；保留选区、数量与冲突明细，返回修改。是否应改成跳过失败格，留待用户决定。':'可写入临时草稿体验，再用“撤销”还原。写入草稿不会采用计划。'}</p><div class="footer"><button id="cancel">返回修改</button><button id="apply" class="primary" ${bad.length?'disabled':''}>写入临时草稿</button><button disabled>正式采用（本轮未模拟）</button></div>`;$('cancel').onclick=()=>$('modal').close();$('apply').onclick=()=>{history.push(clone(draft));pending.forEach(x=>draft[x.k]=x.after);$('modal').close();notify('已写入临时草稿；完整业务校验未模拟，可撤销。');render()};$('modal').showModal();}
const topics={swap:['交换机种：下一轮决定','同日同线 A 600 → B 300，交换后是 B 300 → A 600（顺序互换），还是 B 600 → A 300（机种替换、位置数量不动）？是否允许跨线交换？','建议把“调整顺序”“替换机种”“交换生产段”分开命名，避免一次操作承担三种含义。'],push:['改量顺延：下一轮决定','把 A 从 600 改到 1,200 后，应该移动同线全部后续安排，还是仅搬走放不下的部分？遇到 Holiday、锁定或跨周待确认在哪里停？','建议先明确允许影响的截止日期和线体，只生成预览，未安排量单列；不自动扩展范围。'],lock:['锁定、比较与恢复：下一轮细化','已有规则：锁定固定日期 × 线体 × 机种的汇总数量，可锁零；不固定日内顺序。恢复历史版也不能绕过当前锁定。','界面待决定：锁定入口、批量解锁、数量差与顺序差并排展示、恢复冲突的处理路径。原型示例 L01 10/7 的 A 已锁，L02 10/8 的 B 锁零。']};
function topic(k){const t=topics[k];$('modalBody').innerHTML=`<h2>${t[0]}</h2><p>${t[1]}</p><div class="proposal">${t[2]}</div><p class="muted">这是讨论卡片，本轮尚未实现该操作。未经用户反馈，不将建议记作决议。</p><div class="footer"><button id="closeTopic">回到原型</button></div>`;$('closeTopic').onclick=()=>$('modal').close();$('modal').showModal()}
function cycle(delta){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];const u=new URL(location.href);u.searchParams.set('variant',variant);window.history.replaceState({},'',u);render()}
$('prev').onclick=()=>cycle(-1);$('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if($('modal').open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});['lineFilter','modelFilter','zoom'].forEach(id=>$(id).onchange=()=>{if(!lines().includes(focusLine))focusLine=lines()[0];render()});$('resetSelection').onclick=()=>{selected.clear();anchor=null;render()};$('undo').onclick=()=>{if(history.length){draft=history.pop();notify('已撤销上次草稿修改。');render()}};$('reset').onclick=()=>{init();week=0;selected=new Set(['0:2','0:3']);focusLine=0;focusDay=2;notify('示例已重置。');render()};init();render();
</script></body></html>
